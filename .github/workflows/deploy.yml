name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "缺少 GitHub Secret：DEPLOY_SSH_KEY（腾讯云 ubuntu 用户的 SSH 私钥全文）"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 192.144.167.212 >> ~/.ssh/known_hosts
      - name: Sync and restart
        env:
          DEPLOY_HOST: 192.144.167.212
          DEPLOY_USER: ubuntu
          DEPLOY_DIR: /var/www/beiyexing
          DEPLOY_SSH_KEY: ${{ github.workspace }}/../home/runner/.ssh/id_ed25519
        run: |
          export DEPLOY_SSH_KEY="$HOME/.ssh/id_ed25519"
          bash scripts/deploy.sh
