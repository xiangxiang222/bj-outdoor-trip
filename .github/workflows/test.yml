name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ut-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix web
      - name: Unit tests and coverage gate
        run: npm run test:coverage
