# 证书由 scripts/enable-https.sh 放到 /etc/letsencrypt，不进仓库。
# 80 继续反代，避免 443 还没在轻量防火墙放行时把用户跳进连不上的地址。
# 防火墙放行 TCP 443 之后，再把 80 改成跳转到 HTTPS。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name togetherbetter.cn www.togetherbetter.cn _;

    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name togetherbetter.cn www.togetherbetter.cn;

    ssl_certificate /etc/letsencrypt/live/togetherbetter.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/togetherbetter.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
